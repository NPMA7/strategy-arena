<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="saBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b26"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>

    <!-- Amber Gold Gradient -->
    <linearGradient id="saGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="saCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="saGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge / Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#saBg)" stroke="#232d3d" stroke-width="1.5"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>

  <!-- Candlestick Wick subtle guides -->
  <line x1="21" y1="9" x2="21" y2="53" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="41" y1="9" x2="41" y2="20" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 'S' Contour (Algorithmic Curve / High-Low Channel) -->
  <path d="M26 16 L15 16 L15 29 L26 31 L26 47 L14 47" stroke="url(#saGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 'A' Structure (Breakout Apex & Support) -->
  <path d="M31 47 L41 16 L51 47" stroke="url(#saGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossbar (Orderflow Channel) -->
  <path d="M35 37 L47 37" stroke="url(#saCyan)" stroke-width="3" stroke-linecap="round"/>

  <!-- Apex Peak & Synaptic Signal Nodes -->
  <circle cx="41" cy="16" r="3.2" fill="#ffffff" filter="url(#saGlow)"/>
  <circle cx="15" cy="16" r="2.2" fill="#f59e0b"/>
  <circle cx="14" cy="47" r="2.2" fill="#f59e0b"/>
  <circle cx="51" cy="47" r="2.5" fill="#38bdf8"/>
</svg>