name: strategy-arena

services:
  db:
    image: postgres:17-alpine
    container_name: strategy-arena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    volumes:
      - arena-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 3s
      timeout: 3s
      retries: 30

  mt5-vnc:
    image: lprett/mt5linux:latest
    container_name: strategy-arena-mt5-vnc
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "rm -f /opt/wineprefix/drive_c/server; exec /app/src/main.sh"]
    ports:
      - "3000:8080"
      - "5901:5901"
      - "18812:18812"
    environment:
      NOVNC_HOST: ""
      LOGIN: "6310591"
      PASSWORD: "dL7ny!PE"
      SERVER: "Headway-Demo"
      MT5_LOGIN: "6310591"
      MT5_PASSWORD: "dL7ny!PE"
      MT5_SERVER: "Headway-Demo"
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: strategy-arena-app:latest
    container_name: strategy-arena-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mt5-bridge:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://arena:arena@db:5432/arena
      ARENA_PAIRS: "100"
      ARENA_WARMUP_MIN: "0"
      ARENA_BINANCE_REST: https://data-api.binance.vision
      ARENA_BINANCE_WS: wss://data-stream.binance.vision
      ARENA_SNAPSHOT_SEC: "2"
      MT5_BRIDGE_URL: http://mt5-bridge:5000
    volumes:
      - ./server:/app/server
      - ./frontend:/app/frontend
    ports:
      - "8080:8080"

  mt5-bridge:
    build:
      context: .
      dockerfile: docker/mt5-bridge.Dockerfile
    image: strategy-arena-mt5-bridge:latest
    container_name: strategy-arena-mt5-bridge
    restart: unless-stopped
    depends_on:
      - mt5-vnc
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MT5_RPYC_HOST: "mt5-vnc"
      MT5_RPYC_PORT: "18812"
    volumes:
      - ./server/mt5_bridge_server.py:/app/server/mt5_bridge_server.py:ro

volumes:
  arena-pgdata:
