name: strategy-arena

services:
  db:
    image: postgres:17-alpine
    container_name: strategy-arena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena}
      POSTGRES_DB: ${POSTGRES_DB:-arena}
    volumes:
      - arena-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arena} -d ${POSTGRES_DB:-arena}"]
      interval: 3s
      timeout: 3s
      retries: 30

  mt5-vnc:
    image: lprett/mt5linux:latest
    container_name: strategy-arena-mt5-vnc
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "rm -f /opt/wineprefix/drive_c/server; exec /app/src/main.sh"]
    ports:
      - "127.0.0.1:${MT5_VNC_HTTP_PORT:-3001}:8080"
      - "127.0.0.1:${MT5_VNC_PORT:-5901}:5901"
      - "127.0.0.1:${MT5_RPYC_PORT:-18812}:18812"
    environment:
      NOVNC_HOST: ""
      LOGIN: "${MT5_LOGIN:-6310591}"
      PASSWORD: "${MT5_PASSWORD:-dL7ny!PE}"
      SERVER: "${MT5_SERVER:-Headway-Demo}"
      MT5_LOGIN: "${MT5_LOGIN:-6310591}"
      MT5_PASSWORD: "${MT5_PASSWORD:-dL7ny!PE}"
      MT5_SERVER: "${MT5_SERVER:-Headway-Demo}"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: strategy-arena-app:latest
    container_name: strategy-arena-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mt5-bridge:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://arena:arena@db:5432/arena}
      START_EQUITY: ${START_EQUITY:-1000.0}
      RISK_PER_TRADE: ${RISK_PER_TRADE:-0.02}
      SINGLE_POS_CAP: ${SINGLE_POS_CAP:-0.20}
      SL_MULT: ${SL_MULT:-2.0}
      FOREX_TARGET_RISK: ${FOREX_TARGET_RISK:-15.0}
      ARENA_PAIRS: ${ARENA_PAIRS:-100}
      ARENA_WARMUP_MIN: ${ARENA_WARMUP_MIN:-0}
      ARENA_BINANCE_REST: ${ARENA_BINANCE_REST:-https://data-api.binance.vision}
      ARENA_BINANCE_WS: ${ARENA_BINANCE_WS:-wss://data-stream.binance.vision}
      ARENA_SNAPSHOT_SEC: ${ARENA_SNAPSHOT_SEC:-2}
      MT5_BRIDGE_URL: ${MT5_BRIDGE_URL:-http://mt5-bridge:5000}
    volumes:
      - ./server:/app/server
      - ./frontend:/app/frontend
      - ./.env:/app/.env:ro
    ports:
      - "${APP_PORT:-8080}:8080"

  mt5-bridge:
    build:
      context: .
      dockerfile: docker/mt5-bridge.Dockerfile
    image: strategy-arena-mt5-bridge:latest
    container_name: strategy-arena-mt5-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MT5_BRIDGE_PORT:-5000}:5000"
    environment:
      PORT: "${MT5_BRIDGE_PORT:-5000}"
      MT5_RPYC_HOST: "${MT5_RPYC_HOST:-sa-copytrade-mt5}"
      MT5_RPYC_PORT: "${MT5_RPYC_PORT:-18812}"
    volumes:
      - ./server/mt5_bridge_server.py:/app/server/mt5_bridge_server.py:ro
    networks:
      - default
      - copytrade-net

volumes:
  arena-pgdata:

networks:
  default:
  copytrade-net:
    external: true
    name: sa-copytrade_default
