<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 64" width="296" height="64" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b26"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem (60x60) with SA Monogram -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logoBg)" stroke="#232d3d" stroke-width="1.5"/>
    <rect x="1.5" y="1.5" width="57" height="57" rx="14.5" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>

    <!-- Subtle Candlestick Wicks -->
    <line x1="21" y1="9" x2="21" y2="51" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="41" y1="9" x2="41" y2="20" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 'S' Contour (Algorithmic Curve / High-Low Channel) -->
    <path d="M26 16 L15 16 L15 29 L26 31 L26 46 L14 46" stroke="url(#logoGold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 'A' Structure (Breakout Apex & Support) -->
    <path d="M31 46 L41 16 L51 46" stroke="url(#logoGold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Orderflow Bridge / Crossbar -->
    <path d="M35 36 L47 36" stroke="url(#logoCyan)" stroke-width="3" stroke-linecap="round"/>

    <!-- Apex & Synaptic Signal Nodes -->
    <circle cx="41" cy="16" r="3.2" fill="#ffffff" filter="url(#logoGlow)"/>
    <circle cx="15" cy="16" r="2.2" fill="#f59e0b"/>
    <circle cx="14" cy="46" r="2.2" fill="#f59e0b"/>
    <circle cx="51" cy="46" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Wordmark Text (Pure Crisp Vector Typographic Hierarchy) -->
  <g transform="translate(76, 14)">
    <!-- Primary Heading -->
    <text x="0" y="22" font-family="Sora, Inter, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#f3f4f6" letter-spacing="-0.3">
      STRATEGY<tspan fill="#f59e0b" dx="6">ARENA</tspan>
    </text>
    <!-- Secondary Subtitle -->
    <text x="0" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="9" fill="#71717a" letter-spacing="1.2">
      MULTI-ASSET QUANTITATIVE ENGINE
    </text>
  </g>
</svg>
